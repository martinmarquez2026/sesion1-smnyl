html,body{margin:0; height:100%;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--navy); -webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 0%, #FFFDF9 0%, #F7F2EA 40%, var(--bg) 80%), var(--bg); background-attachment:fixed;}
.app{display:flex; flex-direction:column; height:100dvh;}
svg.ic{width:1em; height:1em; display:inline-block; vertical-align:-.125em;}

/* ---------- Pantalla previa ---------- */
.pre{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%, #FFFDF9 0%, #F7F2EA 45%, #F1EBE0 85%); padding:24px;}
.pre-card{background:#fff; border:1px solid var(--line); border-radius:22px; padding:clamp(24px,4vw,40px);
  max-width:440px; width:100%; text-align:center; box-shadow:0 2px 6px rgba(38,52,73,.05),0 24px 60px -20px rgba(60,45,20,.28);}
.pre-k{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);}
.pre-t{font-size:clamp(1.3rem,3vw,1.7rem); font-weight:700; margin:6px 0 4px;}
.pre-s{font-size:13px; color:var(--muted); margin:0 0 22px;}
.pre label{display:block; text-align:left; font-size:12px; color:var(--muted); margin:0 0 5px 2px;}
.pre input{width:100%; height:44px; border-radius:12px; border:1px solid var(--line); background:#FBF9F5;
  padding:0 14px; font:500 15px 'Inter',sans-serif; color:var(--navy); margin-bottom:14px;}
.pre input:focus{outline:none; border-color:var(--gold-light); background:#fff;}
.pre-go{width:100%; height:46px; border:none; border-radius:50px; background:var(--navy); color:#fff;
  font:600 14px 'Inter',sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .15s;}
.pre-go:hover{filter:brightness(1.08);}
.pre-note{font-size:11px; color:var(--faint); margin-top:14px; line-height:1.5;}

/* ---------- Escenario (cliente) ---------- */
.stage{flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:clamp(18px,3vw,44px); overflow:auto;}
.stage-inner{width:100%; max-width:680px; text-align:center;}

/* ---------- Consola (asesor) ---------- */
.console{flex:0 0 auto; background:#2b3a51; padding:9px 16px 11px;}
.mrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:34px;}
.nav{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:9px; padding-top:9px; border-top:1px solid rgba(255,255,255,.08);}
.dot{cursor:pointer; width:26px; height:26px; border-radius:50%; border:1px solid var(--console-line);
  background:transparent; color:#aeb9c9; font:600 12px 'Inter',sans-serif; display:flex; align-items:center; justify-content:center;}
.dot:hover{border-color:var(--gold-light); color:#e8eef6;}
.dot.on{background:var(--gold-light); color:#1f2b3d; border-color:var(--gold-light);}
.navlabel{font-size:11px; color:#8ea1b8; margin-left:4px; min-width:96px;}
.spacer{flex:1;}
.tool{cursor:pointer; border:1px solid var(--console-line); background:transparent; color:#c7d2e0;
  font:500 12px 'Inter',sans-serif; padding:6px 12px; border-radius:50px; display:inline-flex; align-items:center; gap:5px;}
.tool:hover{color:#fff; border-color:#6f86a4;}
.tool.gold{background:var(--gold-light); color:#1f2b3d; border-color:var(--gold-light);}
/* controles del momento */
.lbl{font-size:11px; color:#a9c0e0; white-space:nowrap;}
.fld{height:32px; border-radius:8px; border:1px solid var(--console-line); background:var(--console-bg);
  color:#fff; padding:0 11px; font:400 13px 'Inter',sans-serif;}
.fld:focus{outline:none; border-color:var(--gold-light);}
.btn{cursor:pointer; border:none; background:var(--gold-light); color:#1f2b3d; font:500 12px 'Inter',sans-serif;
  padding:8px 15px; border-radius:50px; display:inline-flex; align-items:center; gap:5px;}
.btn:hover{filter:brightness(.97);}
.gline{font-size:11px; color:#7f9bc2; margin-top:7px;}

/* ---------- M1 ---------- */
.kicker{font-size:clamp(1.05rem,2.4vw,1.55rem); color:var(--muted); font-weight:400;}
.kicker.acento{color:#a9946f; font-family:'Fraunces',Georgia,serif; font-style:italic;
  font-size:clamp(1.2rem,2.8vw,1.8rem);}
.who{font-size:clamp(3rem,11vw,6.5rem); font-weight:700; line-height:1.02; margin-top:6px; letter-spacing:-.02em;
  animation:settle .7s var(--ease) both;}
.agenda-title{font-size:clamp(1.35rem,3.2vw,2rem); font-weight:600; margin:0 0 clamp(16px,2.4vw,26px);}
.blocks{display:flex; flex-direction:column; gap:clamp(11px,1.7vw,16px);}
.blk{display:flex; align-items:center; gap:clamp(13px,1.8vw,18px); text-align:left; background:var(--card);
  border:1px solid rgba(38,52,73,.06); border-radius:18px; padding:clamp(15px,2.2vw,22px);
  opacity:.26; transform:translateY(4px); box-shadow:0 1px 2px rgba(38,52,73,.03);
  transition:opacity .5s var(--ease), transform .5s var(--ease), box-shadow .5s var(--ease);}
.blk.on{opacity:1; transform:translateY(0);
  box-shadow:0 1px 2px rgba(38,52,73,.04),0 12px 30px -12px rgba(60,45,20,.16); animation:settle .55s var(--ease) both;}
.bico{width:clamp(38px,4.2vw,48px); height:clamp(38px,4.2vw,48px); border-radius:12px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:clamp(20px,2.3vw,26px);}
.btxt h3{font-size:clamp(.72rem,1.15vw,.8rem); font-weight:600; margin:0 0 4px; color:var(--faint);
  text-transform:uppercase; letter-spacing:.07em;}
.btxt p{font-size:clamp(1rem,2vw,1.3rem); color:var(--navy); line-height:1.35; margin:0; font-weight:500;}
.ask{font-size:clamp(1.6rem,4.6vw,2.9rem); font-weight:600; line-height:1.2; max-width:14ch; margin:0 auto;
  animation:settle .6s var(--ease) both; letter-spacing:-.01em;}
.stub{color:var(--faint); font-size:clamp(1rem,2.2vw,1.25rem); font-weight:500;}
.stub b{color:var(--navy); font-weight:600;}

@keyframes settle{0%{opacity:0; transform:translateY(14px) scale(.985);}60%{opacity:1;}100%{opacity:1; transform:translateY(0) scale(1);}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

/* ===== M2 ===== */
/* ---- Tiempo 1: Martín ---- */
  .fotos{display:flex; align-items:center; justify-content:center; gap:clamp(10px,1.6vw,16px);}
.foto{border-radius:16px; overflow:hidden; background:#dfe6ee; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 6px 18px rgba(27,58,107,.10);}
.foto img{width:100%; height:100%; object-fit:cover; display:block;}
.foto.side, .foto.main{width:clamp(96px,17vw,175px); height:clamp(96px,17vw,175px); border-radius:16px;}
.ph{font-size:10px; color:#9fb0c2; padding:6px; line-height:1.4; word-break:break-all;}
.mi-nombre{font-size:clamp(1.5rem,3.6vw,2.3rem); font-weight:700; letter-spacing:-.01em;
    margin:clamp(14px,2.2vw,22px) 0 0; line-height:1.15;}
.datos{display:flex; align-items:center; justify-content:center; gap:clamp(8px,1.4vw,14px);
    flex-wrap:wrap; margin-top:clamp(10px,1.6vw,14px);}
.datos span{font-size:clamp(.8rem,1.5vw,1rem); color:#3f5064; font-weight:500;}
.datos b{width:4px; height:4px; border-radius:50%; background:var(--gold-light); display:block;}
.ced{font-size:clamp(.66rem,1.1vw,.76rem); color:var(--faint); letter-spacing:.04em; margin-top:clamp(10px,1.5vw,14px);}
/* ---- Tiempo 2: SMNYL ---- */
  .co-name{font-size:clamp(1.35rem,3.2vw,2.05rem); font-weight:700; line-height:1.15; letter-spacing:-.01em; margin:0;}
.edificio{width:100%; max-width:520px; margin:clamp(14px,2.2vw,20px) auto 0; aspect-ratio:16/9;
    border-radius:16px; overflow:hidden; background:#dfe6ee; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;}
.edificio img{width:100%; height:100%; object-fit:cover; display:block;}
.co-list{display:flex; flex-direction:column; gap:clamp(9px,1.4vw,13px); margin-top:clamp(14px,2.2vw,20px);
    max-width:560px; margin-left:auto; margin-right:auto;}
.co-row{display:flex; align-items:center; gap:clamp(12px,1.7vw,16px); text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:clamp(13px,1.9vw,18px);}
.co-ico{width:clamp(34px,3.8vw,42px); height:clamp(34px,3.8vw,42px); border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:clamp(18px,2vw,22px);}
.co-ico svg{width:1em; height:1em; display:block;}
.co-row p{margin:0; font-size:clamp(.88rem,1.7vw,1.12rem); color:var(--navy); font-weight:500; line-height:1.4;}
/* ---- Tiempo 3: Cuéntame de ti ---- */
  .pausa{font-size:clamp(1.8rem,5.4vw,3.4rem); font-weight:600; line-height:1.18;
    max-width:15ch; margin:0 auto; letter-spacing:-.01em;}
.co-row,.edificio{box-shadow:0 1px 2px rgba(27,58,107,.04),0 12px 30px -12px rgba(27,58,107,.13);}
/* ===== M3 ===== */
/* 1 · Ancla */
  .tesis{font-size:clamp(1.9rem,6vw,3.6rem); font-weight:700; line-height:1.15; letter-spacing:-.02em; margin:0;}
.tesis .neg{color:var(--faint); font-weight:600;}
.tesis .pos{color:var(--navy);}
/* 2 y 3 · Caras */
  .cara-lbl{font-size:clamp(.68rem,1.1vw,.78rem); letter-spacing:.1em; text-transform:uppercase;
    font-weight:600; margin:0 0 clamp(12px,1.8vw,18px);}
.duo{display:flex; justify-content:center; gap:clamp(14px,2.6vw,30px); margin-bottom:clamp(16px,2.4vw,24px);}
.item{display:flex; flex-direction:column; align-items:center; gap:9px; width:clamp(104px,16vw,150px);}
.draw{width:clamp(72px,9vw,104px); height:clamp(72px,9vw,104px); border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;}
.draw svg{width:76%; height:76%; display:block;}
.item span{font-size:clamp(.7rem,1.22vw,.84rem); color:var(--muted); font-weight:400; line-height:1.35;}
.item span b{display:block; color:var(--navy); font-weight:600; font-size:clamp(.78rem,1.4vw,.95rem); margin-bottom:2px;}
.duo.trio{gap:clamp(10px,1.8vw,22px);}
.duo.trio .item{width:clamp(96px,14vw,168px);}
.duo.trio .draw{width:clamp(64px,7.6vw,90px); height:clamp(64px,7.6vw,90px);}
.frase{font-size:clamp(1.2rem,3.2vw,2rem); font-weight:600; line-height:1.25;
    max-width:20ch; margin:0 auto; letter-spacing:-.01em;}
/* 4 · Sellos */
  .sellos-t{font-size:clamp(1.15rem,2.6vw,1.6rem); font-weight:600; margin:0 0 clamp(14px,2.2vw,22px); line-height:1.3;}
.sellos{display:flex; justify-content:center; gap:clamp(10px,1.8vw,18px); flex-wrap:wrap;}
.sello{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:clamp(14px,2vw,20px) clamp(10px,1.6vw,16px); width:clamp(102px,17vw,175px);
    display:flex; flex-direction:column; align-items:center; gap:9px;}
.sello .ico{width:clamp(34px,3.8vw,44px); height:clamp(34px,3.8vw,44px); border-radius:11px;
    display:flex; align-items:center; justify-content:center; color:#fff;}
.sello .ico svg{width:60%; height:60%;}
.sello span{font-size:clamp(.74rem,1.35vw,.92rem); font-weight:600; line-height:1.3;}
/* 5 · Pregunta */
  .pregunta{font-size:clamp(1.7rem,5vw,3.1rem); font-weight:600; line-height:1.2;
    max-width:15ch; margin:0 auto; letter-spacing:-.01em;}
.sello,.draw{box-shadow:0 1px 2px rgba(27,58,107,.04),0 10px 26px -10px rgba(27,58,107,.12);}
/* ===== chips consola ===== */
.chip{cursor:pointer;border:1px solid var(--console-line);background:transparent;color:#c8d8ee;font:500 12px 'Inter',sans-serif;padding:6px 13px;border-radius:50px;white-space:nowrap;}
.chip:hover{border-color:var(--gold-light);}
.chip.on{background:var(--gold-light);color:#1f2b3d;border-color:var(--gold-light);}

    border-radius:20px; font-size:clamp(32px,4vw,46px);}
  .spot .title{font-size:clamp(1.5rem,3.5vw,2.4rem); font-weight:600; margin:14px 0 0;}

    margin:16px auto 0; max-width:640px;}

  var COIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.2a3 3 0 0 0-2.5-1.2c-1.4 0-2.5.8-2.5 2s1.1 1.8 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2a3 3 0 0 1-2.5-1.2"/><path d="M12 6.2v11.6"/></svg>';
  var CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>';
  var WA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.74.46 3.44 1.32 4.94L2.1 22l5.35-1.4a9.8 9.8 0 0 0 4.59 1.17h.01c5.43 0 9.84-4.4 9.84-9.84 0-2.63-1.02-5.1-2.88-6.96A9.77 9.77 0 0 0 12.04 2zm0 17.94h-.01a8.2 8.2 0 0 1-4.16-1.14l-.3-.18-3.09.81.82-3.02-.2-.31a8.15 8.15 0 0 1-1.25-4.36c0-4.52 3.68-8.19 8.2-8.19a8.14 8.14 0 0 1 5.79 2.4 8.13 8.13 0 0 1 2.4 5.8c0 4.52-3.68 8.19-8.2 8.19zm4.49-6.13c-.25-.12-1.46-.72-1.68-.8-.23-.09-.39-.13-.56.12s-.64.8-.79.97c-.14.16-.29.18-.54.06a6.7 6.7 0 0 1-1.97-1.22 7.4 7.4 0 0 1-1.36-1.7c-.15-.24 0-.38.11-.5.11-.11.25-.29.37-.44.12-.15.16-.25.25-.42.08-.16.04-.31-.02-.43-.06-.13-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.16 0-.43.06-.65.31-.22.25-.85.83-.85 2.03s.87 2.35.99 2.51c.12.16 1.71 2.62 4.15 3.68.58.25 1.03.4 1.39.51.58.19 1.11.16 1.53.1.47-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.15-1.17-.06-.11-.22-.17-.47-.29z"/></svg>';
  function D(){ return { nombre:SESSION.nombre||'', prioridad:(PRIOS[SESSION.prioridad||1]||{}).label||'—', presupuesto:+SESSION.presupuesto||0, cita:SESSION.citaCorto||SESSION.cita||'—' }; }
  function telNow(){ return ST.m8.tel || SESSION.telefono || ''; }
  function mensaje(){ var d=D();
    return 'Hola '+d.nombre+', gracias por tu tiempo hoy.\n\nEste es el resumen de lo que vimos:\n\n'+
      '*Punto de partida:* '+d.prioridad+'\n*Presupuesto mensual:* '+fmt.format(d.presupuesto)+'\n*Próxima cita:* '+d.cita+' por Google Meet\n\n'+
      'Cualquier duda, aquí estoy para ti.\n\n*Martín Márquez* — Agente de seguros\nCédula CNSF G408760';
  }
  function preview(){ return esc(mensaje()).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
  function waURL(){ var digits=telNow().replace(/\D/g,''); if(digits.length===10) digits='52'+digits; var base=digits?'https://wa.me/'+digits:'https://wa.me/'; return base+'?text='+encodeURIComponent(mensaje()); }
  function rowHTML(svg,bg,label,val){ return '<div class="r"><span class="ricon" style="background:'+bg+'">'+svg+'</span><span class="rlbl">'+label+'</span><span class="rval">'+val+'</span></div>'; }
  MOMENTS[8]={ name:'Cierre',
    render:function(){
      var d=D();
      if(!ST.m8.sent){
        stage.innerHTML='<div class="stage-inner"><h1 class="thanks">Gracias por tu confianza, '+esc(d.nombre)+'.</h1><p class="sub">Esto es lo que construimos hoy. Te lo mando a tu WhatsApp para que lo tengas a la mano.</p><div class="card">'+
          rowHTML(STACK,'var(--navy)','Tu punto de partida', esc(d.prioridad))+
          rowHTML(COIN,'var(--gold-light)','Tu presupuesto mensual', '<span class="cnt">'+fmt.format(d.presupuesto)+'</span>')+
          rowHTML(CAL,'var(--blue)','Tu próxima cita', esc(d.cita)+' · por Meet')+
          '</div></div>';
        animateCounts();
      } else {
        stage.innerHTML='<div class="stage-inner"><span class="okbadge">'+WA+'</span><h1 class="thanks" style="font-size:clamp(1.25rem,2.6vw,1.6rem); margin-top:14px;">Resumen enviado</h1><p class="sub" style="margin-top:6px;">Le llegó a su WhatsApp'+(telNow()?' ('+esc(telNow())+')':'')+'.</p><p class="bye">Fue un gusto, '+esc(d.nombre)+'. Nos vemos en tu próxima cita.</p></div>';
      }
    },
    console:function(){
      if(!ST.m8.sent){
        mconsole.innerHTML='<span class="lbl">Teléfono</span><input id="i_tel8" type="tel" class="fld" style="width:150px" placeholder="668 123 4567" value="'+esc(telNow())+'" /><button class="btn-wa" id="sendBtn">'+WA+' Enviar por WhatsApp</button><button class="btn-outline" id="copyBtn">'+icon('copy')+' Copiar mensaje</button><div class="wa-prev"><span class="pl">Vista previa del mensaje</span>'+preview()+'</div>';
        document.getElementById('i_tel8').oninput=function(e){ ST.m8.tel=e.target.value; };
        document.getElementById('sendBtn').onclick=function(){ var el=document.getElementById('i_tel8'); ST.m8.tel=el?el.value:''; window.open(waURL(),'_blank','noopener'); ST.m8.sent=true; draw(); };
        document.getElementById('copyBtn').onclick=function(){ try{navigator.clipboard.writeText(mensaje());}catch(e){} this.innerHTML=icon('check')+' ¡Copiado!'; };
      } else {
        mconsole.innerHTML='<span class="status">'+icon('check')+' Sesión completa</span><button class="tool" id="resetBtn" style="margin-left:auto">'+icon('refresh')+' Reiniciar</button>';
        document.getElementById('resetBtn').onclick=function(){ ST.m8.sent=false; draw(); };
      }
    }
  };
})();

/* ===== Router / navegación ===== */
var cur=1;
function draw(){
  app.setAttribute('data-moment', cur);
  MOMENTS[cur].render();
  MOMENTS[cur].console();
  var dots=''; for(var i=1;i<=8;i++){ dots+='<button class="dot'+(i===cur?' on':'')+'" data-go="'+i+'">'+i+'</button>'; }
  document.getElementById('dots').innerHTML=dots;
  document.getElementById('navlabel').textContent=MOMENTS[cur].name;
  var d=document.querySelectorAll('[data-go]');
  for(var j=0;j<d.length;j++){ d[j].addEventListener('click',function(){ cur=+this.getAttribute('data-go'); draw(); }); }
}
document.getElementById('prevBtn').onclick=function(){ if(cur>1){cur--; if(cur===1)ST.m1={fase:0,nivel:0}; draw();} };
document.getElementById('nextBtn').onclick=function(){ if(cur<8){cur++; draw();} };

/* ===== Copiar todo (red de seguridad) ===== */
document.getElementById('copyAll').onclick=function(){
  var L=['SESIÓN ANF — '+(SESSION.nombre||''),
    'Teléfono: '+(SESSION.telefono||'—'),
    'Prioridad: '+SESSION.prioridad,
    'Presupuesto: '+(SESSION.presupuesto||'—'),
    'Cita: '+(SESSION.cita||'—'),
    'Referidos: '+(SESSION.referidos.length?SESSION.referidos.map(function(r){return r.nombre+' '+(r.tel||'');}).join(' | '):'—')];
  var t=L.join('\n');
  try{navigator.clipboard.writeText(t);}catch(e){}
  this.innerHTML=icon('check')+' Copiado';
  var self=this; setTimeout(function(){self.innerHTML='Copiar todo';},1500);
};

/* ===== Arranque: pantalla previa ===== */
document.getElementById('pre-go').onclick=function(){
  SESSION.nombre=document.getElementById('pre-nom').value.trim();
  SESSION.telefono=document.getElementById('pre-tel').value.trim();
  if(!SESSION.nombre){ document.getElementById('pre-nom').focus(); return; }
  document.getElementById('pre').style.display='none';
  cur=1; ST.m1={fase:0,nivel:0}; draw();
};
document.getElementById('pre-nom').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('pre-tel').focus(); });
document.getElementById('pre-tel').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('pre-go').click(); });
draw();
</script>
