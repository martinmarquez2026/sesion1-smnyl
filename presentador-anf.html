<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EMA — Panel Presentador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{--navy:#1B3A6B;--gold:#C9A84C;--red:#FC8181;--green:#68D391;--bg:#0a1628;--card:#111e35;--border:rgba(255,255,255,0.08)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:white;min-height:100vh;display:flex;flex-direction:column}

  #top{background:#0d1929;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .t-slide{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
  .t-name{font-size:13px;color:rgba(255,255,255,0.55);margin-top:2px}
  .t-timer{font-size:20px;font-weight:800;color:white}
  .t-timer.warn{color:#FBD38D}
  .t-timer.danger{color:var(--red)}

  #nav{display:flex;gap:7px;padding:9px 12px;background:#0d1929;border-bottom:1px solid var(--border)}
  .nav-p{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-align:center}
  .nav-p.prev{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6)}
  .nav-p.next{background:var(--navy);color:white}
  .nav-p.pause{background:rgba(252,129,129,0.15);color:var(--red);flex:0 0 50px}

  #special-controls{padding:0 12px;background:#0d1929}

  #slide-selector-wrap{padding:9px 12px;background:#0d1929;border-bottom:1px solid var(--border);position:relative}
  #slide-selector-btn{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:white;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-align:left}
  #slide-selector-btn .ssb-chevron{color:rgba(255,255,255,0.4);font-size:11px}
  #slide-selector-dropdown{display:none;position:absolute;left:12px;right:12px;top:100%;margin-top:4px;background:#152238;border:1px solid var(--border);border-radius:10px;max-height:280px;overflow-y:auto;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
  #slide-selector-dropdown.open{display:block}
  .ssd-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer}
  .ssd-item:last-child{border-bottom:none}
  .ssd-item:hover{background:rgba(255,255,255,0.04)}
  .ssd-label{display:flex;align-items:center;gap:9px;font-size:12.5px;color:rgba(255,255,255,0.85);flex:1}
  .ssd-num{width:22px;height:22px;border-radius:50%;background:rgba(201,168,76,0.15);color:var(--gold);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ssd-item.hidden-slide .ssd-num{position:relative}
  .ssd-item.hidden-slide .ssd-num::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:#FC8181;transform:rotate(-45deg)}
  .ssd-item.hidden-slide .ssd-label{color:rgba(255,255,255,0.35)}
  .ssd-toggle{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:6px;flex-shrink:0}
  .ssd-toggle.visible{background:rgba(104,211,145,0.12);color:var(--green)}
  .ssd-toggle.hidden{background:rgba(252,129,129,0.12);color:var(--red)}
  .ssd-reset-row{padding:9px 12px;border-top:1px solid var(--border)}
  .ssd-reset-btn{width:100%;background:rgba(252,129,129,0.1);border:1px solid rgba(252,129,129,0.25);color:var(--red);border-radius:8px;padding:9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
  .sc-row{display:flex;gap:7px;padding-bottom:9px}
  .sc-btn{flex:1;background:rgba(201,168,76,0.12);color:var(--gold);border:1px solid rgba(201,168,76,0.25);border-radius:9px;padding:9px 8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
  .sc-btn.reset{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);border-color:var(--border);flex:0 0 70px}

  #progress{height:3px;background:rgba(255,255,255,0.1)}
  #prog-fill{height:100%;background:var(--gold);transition:width .4s}

  #tabs{display:flex;border-bottom:1px solid var(--border)}
  .tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,0.35);cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.5px}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

  #content{flex:1;overflow-y:auto;padding:16px 14px}
  #content::-webkit-scrollbar{width:3px}
  #content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

  .momento-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .pitch-block{background:rgba(255,255,255,0.04);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px;margin-bottom:14px;font-size:14px;color:rgba(255,255,255,0.9);line-height:1.7;white-space:pre-line}
  .section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin:14px 0 8px}
  .alert-block{background:rgba(252,129,129,0.08);border:1px solid rgba(252,129,129,0.2);border-radius:10px;padding:12px;margin-bottom:12px}
  .alert-block .al{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .alert-block p{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.5}
  .obj-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
  .obj-q{font-size:13px;font-weight:600;color:#FBD38D;margin-bottom:6px}
  .obj-a{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5}
  .next-preview{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:12px;color:rgba(255,255,255,0.35)}
  .next-preview strong{color:rgba(255,255,255,0.55)}
  .formula-ref{background:rgba(91,143,176,0.1);border:1px solid rgba(91,143,176,0.25);border-radius:10px;padding:12px;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.7);line-height:1.6;font-family:monospace}

  .nota-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .nota-row label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.3)}
  .nota-row input{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:#ffffff;font-weight:600;font-family:'Inter',sans-serif}
  .nota-row input::placeholder{color:rgba(255,255,255,0.25);font-weight:400}
  .nota-row input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,0.1)}
  .computed-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(201,168,76,0.07);border:1px solid rgba(201,168,76,0.15);border-radius:8px;margin-bottom:8px}
  .computed-row .cl{font-size:12px;color:rgba(255,255,255,0.4)}
  .computed-row .cv{font-size:15px;font-weight:700;color:var(--gold)}

  #sync-status{text-align:center;padding:8px;font-size:11px;color:rgba(255,255,255,0.25);background:#0d1929;border-top:1px solid var(--border)}
  #sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#68D391;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>

<div id="top">
  <div>
    <div class="t-slide" id="p-slide-label">Momento 1 / 12</div>
    <div class="t-name" id="p-momento-name">Apertura</div>
  </div>
  <div class="t-timer" id="p-timer">00:00</div>
</div>

<div id="progress"><div id="prog-fill" style="width:8%"></div></div>

<div id="nav">
  <button class="nav-p pause" onclick="cmdPause()">⏸</button>
  <button class="nav-p prev" onclick="cmdNav(-1)">← Ant</button>
  <button class="nav-p next" onclick="cmdNav(1)">Siguiente →</button>
</div>

<div id="slide-selector-wrap">
  <button id="slide-selector-btn" onclick="toggleSlideSelector()">
    <span id="ssb-label">Ir a un slide específico…</span>
    <span class="ssb-chevron">▾</span>
  </button>
  <div id="slide-selector-dropdown"></div>
</div>

<div id="special-controls"></div>

<div id="tabs">
  <div class="tab active" onclick="showTab('pitch')">🎤 Pitch</div>
  <div class="tab" onclick="showTab('obj')">🛡 Objeciones</div>
  <div class="tab" onclick="showTab('notas')">📋 Cliente</div>
</div>

<div id="content"></div>

<div id="sync-status"><span id="sync-dot"></span>Sincronizado con la presentación</div>

<script>
const ORDER = ['s1','s2','s3','s4','s5a','s5b','s6','s7','s8','BIFURCA','s10','s11','sFin'];
let pos = 0;
let activeTab = 'pitch';
let timerSec = 0, timerInt = null;
let rama = '';
let clienteFicha = { nombre:'', email:'' };
try {
  const stored = localStorage.getItem('ema_ficha');
  if (stored) clienteFicha = JSON.parse(stored);
} catch(e){}

function currentSlideId(){
  if (ORDER[pos]==='BIFURCA') return rama==='retiro' ? 's9b' : 's9a';
  return ORDER[pos];
}

const slideMins = { s1:3, s2:3, s3:3, s4:3, s5a:2, s5b:3, s6:6, s7:2, s8:2, s9a:5, s9b:6, s10:3, s11:3, sFin:3 };

const DATA = {
  s1:{ name:'Apertura', pitch:`"Gracias por regalarme este espacio. La idea no es empezar por productos. Primero quiero entender qué estás construyendo, qué te preocupa, y qué parte de tu vida financiera conviene proteger primero.

Al final de la reunión deberíamos tener tres cosas claras: tu prioridad, una posible ruta de solución, y si tiene sentido una segunda cita. ¿Te parece bien?"`,
    obs:[{q:'"¿Me vas a vender algo?"',a:'No en esta sesión. Hoy solo hacemos un diagnóstico. Si al final tiene sentido una propuesta, la presentamos en la segunda sesión y tú decides.'}],
    al:'Si el cliente se ve tenso: baja el ritmo, sonríe, y arranca con una pregunta personal antes del slide 2.',
    sig:'Cómo vamos a trabajar' },

  s2:{ name:'Cómo vamos a trabajar', pitch:`Toca cada tab en el archivo cliente mientras hablas de cada uno: Propósito, Proceso, Beneficio.

El tab "Beneficio" en pantalla ya tiene el pitch completo de apertura visible para el cliente — puedes leerlo junto con él o parafrasearlo con tus propias palabras mientras lo señalas en pantalla.

Aquí también es buen momento para sembrar la mención de referidos: "Si esta plática llega a tener valor para ti, al final te voy a pedir un favor."`,
    obs:[{q:'"¿Cuánto va a durar esto?"',a:'40 minutos exactos. Te lo respeto.'}],
    al:'Toca cada tab conforme hablas — el cliente ve el cambio en tiempo real en su pantalla.',
    sig:'¿Quiénes somos?' },

  s3:{ name:'¿Quiénes somos?', pitch:`"Soy Martín Márquez, Ingeniero por la UNAM. Me dedico exclusivamente a atención a clientes y negocios, con especialización en Vida, Ahorro y Retiro — nada más.

New York Life tiene más de 170 años y nunca ha dejado de pagar una reclamación. En México, SMNYL lleva 86 años, es Great Place to Work, miembro MDRT y tiene calificación A.M. Best."

Aquí es cuando preguntas: "Cuéntanos sobre ti — tu nombre completo, a qué te dedicas, algún hobby, y si ya conoces algo de seguros."`,
    obs:[{q:'"¿Solo trabajas con una aseguradora?"',a:'Sí. Eso me permite conocer los productos a fondo y recomendarte solo lo que te conviene.'}],
    al:'Máximo 3 minutos aquí. Rápido y directo — el cliente no vino a escuchar tu currículum completo.',
    sig:'Patrimonial | Personal' },

  s4:{ name:'Patrimonial | Personal', pitch:`"La mayoría de las personas que me buscan tienen una de estas dos prioridades en mente. Patrimonial es cuando ya tienes algo construido y quieres conservarlo y hacerlo crecer. Personal es cuando lo que más te importa es proteger tu ingreso y el futuro de tu familia.

No te preocupes por elegir 'mal' — vamos a llegar al mismo diagnóstico de cualquier forma. ¿Cuál resuena más contigo hoy?"`,
    obs:[{q:'"Los dos me importan"',a:'Es normal. Pero si tuvieras que priorizar uno hoy, ¿cuál sería?'}],
    al:'Cuando el cliente elige, toca la tarjeta correspondiente en el archivo cliente.',
    sig:'Las 4 metas' },

  s5a:{ name:'Las 4 metas', pitch:`"Antes de hablar de ti específicamente, quiero compartirte algo: estas son las cuatro metas que casi todos nuestros clientes buscan, sin importar su edad o situación."`,
    obs:[], al:'Slide corto — solo presenta las 4 metas, sin profundizar todavía.',
    sig:'Pirámide — Largo plazo' },

  s5b:{ name:'Pirámide — Largo plazo', pitch:`"No todos los productos ni todos los perfiles tienen las mismas necesidades ni el mismo tratamiento fiscal. Por eso trabajamos con este modelo: primero se protege la base — salud, invalidez y fallecimiento — y a partir de ahí se construye el ahorro y finalmente el retiro. No al revés."`,
    obs:[], al:'Este slide cierra el bloque conceptual. El siguiente es la pieza didáctica fuerte — el Blindaje Patrimonial.',
    sig:'Blindaje Patrimonial (animación)' },

  s6:{ name:'Blindaje Patrimonial', pitch:`Usa el botón "Siguiente fase" (abajo) — son 4 clics, cada uno con tiempo moderado para que el cliente vea claramente qué pasa.

CLIC 1: "Esto es lo que protege un seguro de vida." Mientras avanzan las líneas: "Tu ingreso sostiene tu nivel de vida. Cuando el ingreso es mayor al gasto, ese excedente te permite construir patrimonio — una casa, un ahorro."

CLIC 2: "Pero hay eventos que le pueden pasar a cualquiera: un problema de salud, una incapacidad, un fallecimiento." Mientras cae la línea: "Cuando eso pasa, el ingreso cae. Lo que habías construido se va consumiendo."

CLIC 3: "Aquí aparece el verdadero riesgo financiero." Pausa breve. "Lo que hacemos es trasladar ese riesgo a SMNYL."

CLIC 4: "Cuando el evento ocurre, el seguro paga, y tu ingreso se restablece de inmediato — como si nada hubiera pasado. Tu patrimonio sigue construyéndose."`,
    obs:[{q:'"Esto ya lo sé, no me va a pasar"',a:'Ojalá nunca pase. Esto no es para alguien que cree que le va a pasar — es para que, si pasa, tu familia no tenga que cambiar de vida.'}],
    al:'🎯 PIEZA CENTRAL DE LA SESIÓN — Tómate tu tiempo. 4 clics, no avances al siguiente slide hasta terminar las 4 fases.',
    sig:'Pirámide de prioridad (1-2-3)',
    special:'blindaje' },

  s7:{ name:'Pirámide de prioridad', pitch:`"Ya viste cómo funciona la protección. Ahora quiero que ordenes esto según tu prioridad real: Retiro, Ahorro, Protección. Toca primero el que sientas más urgente."

El cliente numera del 1 al 3. El primero que elija determina qué calculadora vemos primero.`,
    obs:[{q:'"Todos son importantes"',a:'Lo son. Pero empecemos por el que te quita el sueño hoy — los otros los vemos después.'}],
    al:'El primer clic del cliente decide la rama: si toca Retiro primero, va a la calculadora de Brecha de Retiro. Si toca Ahorro o Protección primero, va a Suma Asegurada.',
    sig:'Concepto Suma Asegurada' },

  s8:{ name:'Concepto Suma Asegurada', pitch:`"La Suma Asegurada es simplemente esto: tu ingreso mensual, multiplicado por 12, multiplicado por los años que tu familia necesitaría ese ingreso si tú faltaras."`,
    obs:[], al:'Slide breve, conceptual. Pasa rápido a la calculadora correspondiente.',
    sig:'Calculadora (según prioridad elegida)' },

  s9a:{ name:'Calculadora — Suma Asegurada', pitch:`"¿Cuánto necesita tu familia al mes para mantener su nivel de vida actual?

[Captura el dato]

Este es el capital que necesitaría estar invertido hoy para que tu familia viviera de los intereses indefinidamente. ¿Sabes lo que vales para ellos?

Al final, pregúntale cuánto podría aportar para iniciar — anótalo en el campo de aporte."`,
    obs:[{q:'"Ese número es muy alto"',a:'En un momento vemos cuánto cuesta proteger eso. El costo es mucho menor de lo que imaginas.'}],
    al:'🔴 GOLPE EMOCIONAL — Deja que el cliente vea el número. Pausa 2-3 segundos.',
    sig:'UDI — El puente a Sesión 2' },

  s9b:{ name:'Calculadora — Brecha de Retiro', pitch:`"Vamos a calcular tu número real. ¿Con cuánto quisieras vivir al mes en tu retiro? ¿A qué edad te gustaría retirarte? ¿Cuál es tu ingreso actual? — esto último lo uso para estimar lo que tu AFORE te daría.

[Captura los datos]

Mira: tu AFORE, bajo condiciones actuales, te daría aproximadamente 29% de tu último salario como pensión — es el dato oficial de CONSAR. La diferencia es tu brecha real.

Al final, pregúntale cuánto podría aportar para iniciar — anótalo en el campo de aporte."`,
    obs:[{q:'"Mi AFORE me cubrirá"',a:'El AFORE promedio cubre 25-30% del último salario — es dato oficial de CONSAR. La brecha real es significativa para la mayoría.'},{q:'"¿De dónde sacas el 29%?"',a:'Es la tasa de reemplazo promedio que usa la propia calculadora oficial de CONSAR en su metodología pública.'}],
    al:'🔴 GOLPE EMOCIONAL — Lee el número en voz alta: "Entonces te faltan [X]." Ese momento abre la Sesión 2.',
    sig:'UDI — El puente a Sesión 2' },

  s10:{ name:'UDI — El puente', pitch:`"En 1995, $1,000 en UDIS representan hoy casi $8,800 en poder adquisitivo real. No te digo qué moneda ganó más. En la Sesión 2 te explico en qué denominación trabaja tu instrumento y por qué protege tu patrimonio."`,
    obs:[{q:'"¿El seguro rinde menos que la bolsa?"',a:'Para patrimonio de largo plazo y retiro, la garantía y la protección fiscal superan la apuesta especulativa.'}],
    al:'No entres en detalles técnicos. Este slide es el anzuelo para la Sesión 2.',
    sig:'Referidos' },

  s11:{ name:'Referidos', pitch:`"Antes de cerrar, te quiero hacer una pregunta honesta: ¿esta plática te aportó algo de valor?

[Esperas respuesta del cliente]

Si es así, ¿conoces a alguien — un familiar, un amigo, un compañero de trabajo — a quien esta misma conversación también le pueda servir? Compárteme su nombre y teléfono, yo me encargo del resto."`,
    obs:[{q:'"Déjame pensar en alguien"',a:'Claro, tómate tu tiempo. Si se te ocurre alguien después, me lo puedes compartir por WhatsApp.'}],
    al:'📝 Captura el nombre y teléfono del referido en tu Sheet CRM — no en esta pantalla.',
    sig:'Cierre — Agendar Sesión 2' },

  sFin:{ name:'Cierre', pitch:`"Ya tienes claridad en algo que la mayoría nunca calcula. En la Sesión 2: propuesta, números específicos para tu perfil, y una decisión. ¿Tienes 45 minutos esta semana?"`,
    obs:[{q:'"Déjame pensarlo"',a:'¿Qué parte necesitas pensar? Si es el costo, eso lo vemos en Sesión 2. Si es el concepto, ¿qué no quedó claro?'},{q:'"Mándame información"',a:'Te mando el resumen. Pero la cotización es personalizada — son 45 minutos la próxima semana. ¿Martes o jueves?'}],
    al:'🚨 No te vayas sin fecha. Propón dos opciones: "¿Martes 6pm o jueves 5pm?"',
    sig:'— Fin de Sesión 1 —' }
};

let slidesOcultos = {};
ORDER.forEach(id => { if (id && id !== 'BIFURCA') slidesOcultos[id] = false; });
slidesOcultos['s9a'] = false;
slidesOcultos['s9b'] = false;

function idEnPosicion(p){
  if (ORDER[p]==='BIFURCA') return rama==='retiro' ? 's9b' : 's9a';
  return ORDER[p];
}

function cmdNav(dir) {
  let next = pos + dir;
  // Saltar posiciones cuyo slide esté oculto
  while (next >= 0 && next < ORDER.length) {
    const id = idEnPosicion(next);
    if (!slidesOcultos[id]) break;
    next += dir;
  }
  if (next<0) next=0;
  if (next>=ORDER.length) next=ORDER.length-1;
  irAPosicion(next);
}

function irAPosicion(next){
  pos = next;
  const id = currentSlideId();
  try { localStorage.setItem('ema_cmd', 'goto_'+id+'_'+Date.now()); } catch(e){}
  updateUI();
}

function cmdPause() {
  alert('Recuerda: toca "Dejar de presentar" en Meet para que el cliente te vea a ti en cámara.');
}

// ══════════════════════════════
// SELECTOR DE SLIDES (dropdown)
// ══════════════════════════════
const SLIDE_LIST = [
  {pos:0, id:'s1', label:'Apertura'},
  {pos:1, id:'s2', label:'Cómo trabajamos'},
  {pos:2, id:'s3', label:'¿Quiénes somos?'},
  {pos:3, id:'s4', label:'Patrimonial | Personal'},
  {pos:4, id:'s5a', label:'Las 4 metas'},
  {pos:5, id:'s5b', label:'Pirámide — Largo plazo'},
  {pos:6, id:'s6', label:'Blindaje Patrimonial'},
  {pos:7, id:'s7', label:'Pirámide de prioridad'},
  {pos:8, id:'s8', label:'Concepto Suma Asegurada'},
  {pos:9, id:'din', label:'Calculadora (según prioridad)'},
  {pos:10, id:'s10', label:'UDI — El puente'},
  {pos:11, id:'s11', label:'Referidos'},
  {pos:12, id:'sFin', label:'Cierre'}
];

function toggleSlideSelector(){
  const dd = document.getElementById('slide-selector-dropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) renderSlideSelector();
}

function renderSlideSelector(){
  const dd = document.getElementById('slide-selector-dropdown');
  let html = '';
  SLIDE_LIST.forEach(item => {
    const realId = item.id === 'din' ? idEnPosicion(item.pos) : item.id;
    const oculto = !!slidesOcultos[realId];
    html += `<div class="ssd-item ${oculto?'hidden-slide':''}">
      <div class="ssd-label" onclick="irAPosicion(${item.pos}); toggleSlideSelector();">
        <span class="ssd-num">${item.pos+1}</span>
        <span>${item.label}</span>
      </div>
      <span class="ssd-toggle ${oculto?'hidden':'visible'}" onclick="event.stopPropagation(); toggleVisibilidad('${realId}')">${oculto?'Oculto':'Visible'}</span>
    </div>`;
  });
  html += `<div class="ssd-reset-row"><button class="ssd-reset-btn" onclick="resetearTodo()">↺ Resetear toda la sesión</button></div>`;
  dd.innerHTML = html;
}

function toggleVisibilidad(id){
  slidesOcultos[id] = !slidesOcultos[id];
  try {
    localStorage.setItem('ema_slide_visibility', JSON.stringify(slidesOcultos));
    localStorage.setItem('ema_visibility_ping', Date.now());
  } catch(e){}
  renderSlideSelector();
}

document.addEventListener('click', e => {
  const wrap = document.getElementById('slide-selector-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('slide-selector-dropdown').classList.remove('open');
  }
});

// ══════════════════════════════
// RESETEAR TODA LA SESIÓN
// ══════════════════════════════
function resetearTodo(){
  if (!confirm('¿Resetear toda la sesión? Esto borra prioridad, calculadoras, ficha del cliente y vuelve al slide 1.')) return;
  rama = '';
  Object.keys(slidesOcultos).forEach(k => slidesOcultos[k] = false);
  clienteFicha = { nombre:'', email:'' };
  try {
    localStorage.setItem('ema_slide_visibility', JSON.stringify(slidesOcultos));
    localStorage.setItem('ema_ficha', JSON.stringify(clienteFicha));
    localStorage.removeItem('ema_rama');
    localStorage.removeItem('ema_priority');
    localStorage.removeItem('ema_suma');
    localStorage.removeItem('ema_brecha');
    localStorage.removeItem('ema_frente');
    localStorage.setItem('ema_remote_reset', Date.now());
  } catch(e){}
  irAPosicion(0);
  toggleSlideSelector();
}

function updateUI() {
  const id = currentSlideId();
  const d = DATA[id];
  timerSec = 0;
  clearInterval(timerInt);
  timerInt = setInterval(tick, 1000);
  document.getElementById('p-timer').textContent = '00:00';
  document.getElementById('p-timer').className = 't-timer';
  document.getElementById('p-slide-label').textContent = 'Momento '+(pos+1)+' / '+ORDER.length;
  document.getElementById('p-momento-name').textContent = d ? d.name : '';
  document.getElementById('prog-fill').style.width = ((pos+1)/ORDER.length*100)+'%';
  renderSpecialControls(id);
  renderContent();
}

function tick() {
  timerSec++;
  const m=Math.floor(timerSec/60), s=timerSec%60;
  const el=document.getElementById('p-timer');
  el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const id = currentSlideId();
  const lim = (slideMins[id]||4)*60;
  el.className = 't-timer' + (timerSec>lim*1.5?' danger':timerSec>lim?' warn':'');
}

function renderSpecialControls(id) {
  const c = document.getElementById('special-controls');
  const d = DATA[id];

  if (d && d.special === 'blindaje') {
    c.innerHTML = `<div class="sc-row">
      <button class="sc-btn" onclick="blindajeNext()">▶ Siguiente fase del Blindaje</button>
      <button class="sc-btn reset" onclick="blindajeReset()">↺ Reiniciar</button>
    </div>`;

  } else if (id === 's2') {
    c.innerHTML = `<div class="sc-row">
      <button class="sc-btn" onclick="remoteClick('tab','proposito')">Propósito</button>
      <button class="sc-btn" onclick="remoteClick('tab','proceso')">Proceso</button>
      <button class="sc-btn" onclick="remoteClick('tab','beneficio')">Beneficio</button>
    </div>`;

  } else if (id === 's4') {
    c.innerHTML = `<div class="sc-row">
      <button class="sc-btn" onclick="remoteClick('opt','patrimonial')">🏛️ Patrimonial</button>
      <button class="sc-btn" onclick="remoteClick('opt','personal')">👨‍👩‍👧 Personal</button>
    </div>`;

  } else if (id === 's7') {
    c.innerHTML = `<div class="sc-row">
      <button class="sc-btn" onclick="remoteClick('pri','retiro')">🏔️ Retiro</button>
      <button class="sc-btn" onclick="remoteClick('pri','ahorro')">💰 Ahorro</button>
      <button class="sc-btn" onclick="remoteClick('pri','proteccion')">🛡️ Protección</button>
      <button class="sc-btn reset" onclick="remoteClick('pri','reset')">↺ Borrar</button>
    </div>`;

  } else if (id === 's9a') {
    c.innerHTML = `<div class="sc-row" style="flex-direction:column;gap:6px">
      <div style="font-size:11px;color:rgba(255,255,255,0.4);padding:2px 2px 0">Gastos fijos mensuales de la familia ($)</div>
      <input type="number" id="remote-c6a" placeholder="35000" oninput="remoteInput('c6a', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:9px 12px;font-size:14px;color:white;font-family:'Inter',sans-serif">
    </div>`;

  } else if (id === 's9b') {
    c.innerHTML = `<div class="sc-row" style="flex-direction:column;gap:6px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">Mensualidad deseada ($)</div>
          <input type="number" placeholder="10000" oninput="remoteInput('c7a', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:13px;color:white;font-family:'Inter',sans-serif">
        </div>
        <div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">Edad actual</div>
          <input type="number" placeholder="40" oninput="remoteInput('c7b', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:13px;color:white;font-family:'Inter',sans-serif">
        </div>
        <div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">Edad de retiro</div>
          <input type="number" placeholder="65" oninput="remoteInput('c7c', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:13px;color:white;font-family:'Inter',sans-serif">
        </div>
        <div>
          <div style="font-size:10px;color:rgba(255,255,255,0.4)">Ingreso mensual actual</div>
          <input type="number" placeholder="10000" oninput="remoteInput('c7d', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:13px;color:white;font-family:'Inter',sans-serif">
        </div>
      </div>
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4)">Otro ingreso pasivo — opcional ($)</div>
        <input type="number" placeholder="0" oninput="remoteInput('c7e', this.value)" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:13px;color:white;font-family:'Inter',sans-serif">
      </div>
    </div>`;

  } else if (id === 'sFin') {
    c.innerHTML = `<div class="sc-row">
      <button class="sc-btn" onclick="remoteAction('agendar')">📅 Agendar Sesión 2</button>
      <button class="sc-btn" onclick="remoteAction('correo')">✉️ Enviar correo</button>
    </div>`;

  } else { c.innerHTML = ''; }
}
function blindajeNext(){ try{ localStorage.setItem('ema_blindaje_fase','next_'+Date.now()); }catch(e){} }
function blindajeReset(){ try{ localStorage.setItem('ema_blindaje_fase','reset'); }catch(e){} }

function remoteClick(tipo, valor){
  try { localStorage.setItem('ema_remote_click', tipo+'_'+valor+'_'+Date.now()); } catch(e){}
}
function remoteInput(campoId, valor){
  try { localStorage.setItem('ema_remote_input', campoId+'|'+valor+'|'+Date.now()); } catch(e){}
}
function remoteAction(accion){
  try { localStorage.setItem('ema_remote_action', accion+'_'+Date.now()); } catch(e){}
}

function showTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active', ['pitch','obj','notas'][i]===t);
  });
  renderContent();
}

function renderContent() {
  const id = currentSlideId();
  const d = DATA[id];
  const c = document.getElementById('content');
  if (!d) { c.innerHTML=''; return; }

  if (activeTab==='pitch') {
    let formulaRef = '';
    if (id==='s9b') {
      formulaRef = `<div class="formula-ref">Capital = mensualidad × 12 × (85−edad retiro)
Pensión AFORE = ingreso × 29.3%
Brecha mensual = mensualidad − (AFORE + otro ingreso)
Ahorro mensual = (brecha×12×años) ÷ (edad retiro−edad actual) ÷ 12</div>`;
    }
    c.innerHTML = `
      <div class="momento-label">${d.name}</div>
      <div class="pitch-block">${d.pitch}</div>
      ${formulaRef}
      ${d.al?`<div class="alert-block"><div class="al">⚠ Atención</div><p>${d.al}</p></div>`:''}
      <div class="next-preview">➜ Siguiente: <strong>${d.sig}</strong></div>`;
  } else if (activeTab==='obj') {
    const obs = d.obs.length ? d.obs.map(o=>`<div class="obj-item"><div class="obj-q">💬 "${o.q}"</div><div class="obj-a">${o.a}</div></div>`).join('') : '<p style="color:rgba(255,255,255,0.3);font-size:13px;padding:16px 0;text-align:center">Sin objeciones frecuentes aquí.</p>';
    c.innerHTML = `<div class="section-label">Objeciones — ${d.name}</div>${obs}`;
  } else {
    c.innerHTML = `
      <div class="section-label">Ficha del cliente</div>
      <div class="nota-row"><label>Nombre</label><input type="text" id="nn" placeholder="Roberto García" value="${clienteFicha.nombre}" oninput="saveFicha('nombre',this.value)"></div>
      <div class="nota-row"><label>Correo electrónico</label><input type="email" id="nem" placeholder="cliente@correo.com" value="${clienteFicha.email}" oninput="saveFicha('email',this.value)"></div>
      <div class="section-label">Resultados calculados</div>
      <div class="computed-row"><span class="cl">Suma Asegurada Ideal</span><span class="cv" id="p-suma">—</span></div>
      <div class="computed-row"><span class="cl">Brecha de Retiro</span><span class="cv" id="p-brecha">—</span></div>
      <div class="computed-row"><span class="cl">Ahorro mensual necesario</span><span class="cv" id="p-esfuerzo">—</span></div>
      <div class="section-label">Prioridad</div>
      <div class="computed-row"><span class="cl">Frente elegido</span><span class="cv" id="p-frente">—</span></div>
      <div class="computed-row"><span class="cl">Rama (1ra prioridad)</span><span class="cv" id="p-rama">—</span></div>`;
    loadStoredData();
  }
}

function saveFicha(campo, valor){
  clienteFicha[campo] = valor;
  try { localStorage.setItem('ema_ficha', JSON.stringify(clienteFicha)); } catch(e){}
}

function loadStoredData() {
  try {
    const suma = localStorage.getItem('ema_suma');
    const brecha = localStorage.getItem('ema_brecha');
    const frente = localStorage.getItem('ema_frente');
    const r = localStorage.getItem('ema_rama');
    if (suma) { const el=document.getElementById('p-suma'); if(el) el.textContent=fmt(parseFloat(suma)); }
    if (brecha) { const bd=JSON.parse(brecha); const be=document.getElementById('p-brecha'); if(be) be.textContent=fmt(bd.brecha); const ee=document.getElementById('p-esfuerzo'); if(ee) ee.textContent=fmt(bd.emensual); }
    if (frente) { const fl={patrimonial:'🏛️ Patrimonial',personal:'👨‍👩‍👧 Personal'}; const fe=document.getElementById('p-frente'); if(fe) fe.textContent=fl[frente]||frente; }
    if (r) { rama=r; const re=document.getElementById('p-rama'); if(re) re.textContent=r==='retiro'?'🏔️ Retiro':'🛡️ Protección/Ahorro'; }
  } catch(e){}
}
function fmt(n){ if(!n||isNaN(n)) return '—'; return '$'+Math.round(n).toLocaleString('es-MX'); }

try {
  window.addEventListener('storage', e=>{
    if (e.key==='ema_rama') { rama = e.newValue; if (activeTab==='notas') loadStoredData(); }
    if ((e.key==='ema_suma'||e.key==='ema_brecha'||e.key==='ema_frente') && activeTab==='notas') loadStoredData();
    if (e.key==='ema_pos') {
      const nuevaPos = parseInt(e.newValue, 10);
      if (!isNaN(nuevaPos) && nuevaPos !== pos) {
        pos = nuevaPos;
        updateUI();
      }
    }
    if (e.key==='ema_slide_visibility') {
      try {
        const v = JSON.parse(e.newValue || '{}');
        slidesOcultos = Object.assign(slidesOcultos, v);
      } catch(err){}
    }
  });
} catch(e){}

updateUI();
</script>
</body>
</html>
